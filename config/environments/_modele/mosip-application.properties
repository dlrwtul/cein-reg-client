# CEIN - modele pour un nouvel environnement.
# Copier ce dossier sous config/environments/<nom>/ et remplacer les valeurs <...>.
environment=LOCAL
mosip.hostname=<hote-api-interne>
mosip.reg.client.url=%s/registration-client/
mosip.reg.logpath=../logs
mosip.reg.healthcheck.url= https://${mosip.hostname}/v1/syncdata/actuator/health
mosip.reg.rollback.path=../BackUp
mosip.reg.cerpath=/cer//mosip_cer.cer
mosip.reg.xml.file.url=%s/registration-client/maven-metadata.xml
mosip.reg.version=1.2.0
mosip.client.upgrade.server.url=https://<hote-public>/

mosip.registration.document_scanner_enabled=Y

mosip.registration.cein.forced-language=fra
mosip.registration.cein.receipt.paper=80
