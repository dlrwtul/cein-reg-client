# CEIN - environnement : sandbox
# Embarque dans registration-services-1.2.0.2.jar (props/mosip-application.properties)
# par tools/build-dist.sh. Valeurs par defaut du poste : les parametres synchronises
# depuis le serveur (registration-default.properties) passent par-dessus.
#
# environment=LOCAL : le client ne controle ni la signature ni les checksums des JAR
# (ClientIntegrityValidator / ClientSetupValidator). Indispensable tant que les JAR
# CEIN remplacent ceux du client telecharge depuis le serveur.
environment=LOCAL
mosip.hostname=api-internal.sandbox.mosip.baamtuservices.com
mosip.reg.client.url=%s/registration-client/
mosip.reg.logpath=../logs
mosip.reg.healthcheck.url= https://${mosip.hostname}/v1/syncdata/actuator/health
mosip.reg.rollback.path=../BackUp
mosip.reg.cerpath=/cer//mosip_cer.cer
mosip.reg.xml.file.url=%s/registration-client/maven-metadata.xml
mosip.reg.version=1.2.0
mosip.client.upgrade.server.url=https://sandbox.mosip.baamtuservices.com/

# Scanner de documents
mosip.registration.document_scanner_enabled=Y

# --- Reglages CEIN (voir CEIN.md, section Configuration CEIN) ---
mosip.registration.cein.forced-language=fra
mosip.registration.cein.receipt.paper=80
